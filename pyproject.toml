[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guardgap"
version = "0.1.0"
description = "Evidence-backed architecture and security control reassessment"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["security", "cloud", "evidence", "compliance", "gcp", "devsecops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "httpx[socks]>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
guardgap = "guardgap.cli:main"

[tool.setuptools.packages.find]
include = ["guardgap*"]

[tool.setuptools.package-data]
guardgap = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
