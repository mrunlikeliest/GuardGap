# Copy to the APPLICATION repository's .github/workflows/guardgap.yml.
# Put this package under tools/guardgap, or replace Install with an install from your own pinned repo/wheel.
# This manual collector works immediately against existing deployed resources.
# For automatic updates, copy its steps into the end of YOUR successful deployment job.
name: GuardGap evidence collection
on:
  workflow_dispatch:
    inputs:
      deployed_image_digest:
        description: Immutable digest built from this checkout (sha256:...)
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: guardgap-staging-${{ github.repository }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install GuardGap collector
        run: python -m pip install ./tools/guardgap
      - name: Collect and submit deployed evidence
        env:
          GUARDGAP_URL: ${{ vars.GUARDGAP_URL }}
          GUARDGAP_TOKEN: ${{ secrets.GUARDGAP_TOKEN }}
          APPLICATION_ID: ${{ vars.GUARDGAP_APPLICATION_ID }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
          IMAGE_DIGEST: ${{ inputs.deployed_image_digest }}
        run: |
          python -m guardgap collect \
            --application "$APPLICATION_ID" --environment staging \
            --repo . --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --gcp-project "$GCP_PROJECT" --region "$GCP_REGION" \
            --run-service "$RUN_SERVICE" \
            --image-digest "$IMAGE_DIGEST" --deployment-status succeeded \
            --output guardgap-evidence.json --url "$GUARDGAP_URL"
          # Add --sql-instance NAME and --bucket NAME for application-owned resources.
          # Add --terraform-plan tfplan.json for intended infrastructure.
          # Add --junit report.xml --test-name test_cross_customer_denied \
          #     --tested-image-digest "$IMAGE_DIGEST" for tests run against this image.
      - name: Create local report
        run: python -m guardgap check guardgap-evidence.json --format markdown --output guardgap-report.md
      - name: Add report to job summary
        run: cat guardgap-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: guardgap-evidence
          path: |
            guardgap-evidence.json
            guardgap-report.md
          retention-days: 7
